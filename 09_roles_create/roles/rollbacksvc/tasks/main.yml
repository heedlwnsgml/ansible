---
# tasks file for rollbacksvc
#####################################
#
# * 방화벽 포트 제거: http, https     -> 변수
# * 서비스 종료: httpd, firewalld     -> 변수
# * 디렉토리/파일 삭제: 
# 	- /var/www/html/index.html      -> 변수
# 	- /etc/httpd/conf.d/vhost.conf  -> 변수
# 	- /var/www/vhosts               -> 변수
# * 패키지 삭제: httpd, mod_ssl
#
#####################################
- name: 1) 방화벽 포트 제거 - {{ fw_svcs }}
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ fw_svcs }}"
  ignore_errors: true

- name: 2) 서비스 종료 - {{ svcs }}
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ svcs }}"
  ignore_errors: true

- name: 3) 디렉토리 파일 삭제 - {{ myfiles }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ myfiles }}"

- name: 4) 패키지 삭제 - {{ pkgs }}
  ansible.builtin.dnf:
    name: "{{ pkgs }}"
    state: absent