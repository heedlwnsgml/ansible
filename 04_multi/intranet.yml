---
#########################################
# ㄱ. 웹 서버 설정 - web1
#
# 1. 패키지 설치 - httpd, firewalld
# 2. 서비스 설정 - /var/www/html/index.html
# 3. 서비스 기동 - httpd.service, firewalld.service
# 4. 방화벽 등록    - http
# 5. selinux(여기서 안 함)
#
#########################################
# 1. 패키지 설치 - httpd, firewalld
# dnf install httpd
  - name: 1. 웹서버 설정 - web1.example.com
    hosts: webservers
    tasks:
      - name: 1. 패키지 설치 - httpd, firewalld
        ansible.builtin.dnf:
          name: 
            - httpd
            - firewalld
          state: present   

# 2. 서비스 설정 - /var/www/html/index.html
# scp files/index.html web1:/var/www/html/index.html

      - name: 2) 서비스 설정
        ansible.builtin.copy:
          src: files/index.html
          dest: /var/www/html/index.html
          mode: '0644'

# 3. 서비스 기동 - systemd_serviece/service(httpd,firewalld)
      - name: 3) 서비스 기동
        ansible.builtin.service:
          name: httpd
          state: started
          enabled: true

      - name: 3) 서비스 기동 
        ansible.builtin.service:
          name: firewalld
          state: started
          enabled: true


# 4. 방화벽 등록 - firewalld(http(80/tcp))
# firewall-cmd --permanent --add-service=http
# firewall-cmd --reload
      - name: 4) 방화벽 등록 - http
        ansible.posix.firewalld:
          service: http
          state: enabled
          permanent: true
          immediate: true
      


#
# 2. 웹확인 - localhost -> web1
#
# 1) 웹 요청 - uri(http://web1.example.com)
# # # curl http://web1.example.com
  - name: 2. 웹확인
    hosts: localhost
    become: false
    tasks: 
      - name: 1) 웹요청 - http://web1.example.com
        ansible.builtin.uri:
          url: http://web1.example.com
          return_content: true
        register: html

      - name: 2) 웹 응답
        ansible.builtin.debug:
          var: html.content
