---
########################################
# restore_playbook.yml
#
# 복원 작업 계획
#
# 1) firewalld http/https 포트 close
# 2) /etc/httpd/secrets 제거
# 3) /var/www/html/index.html 제거
# 4) /var/www/html/.htaccess -> htaccess.OLD
# 5) httpd 서비스 disable
# 6) httpd 패키지 삭제
#
# (주의)
# 이전에 사용했던 변수를 사용한다.
# vars_files 지시자 사용
########################################

- name: Restore Playbook - 웹서버 복원
  hosts: ansible1.example.com

  vars_files:
    - vars/vars.yml

  tasks:

    # ----------------------------------------
    # 1) firewalld http/https 포트 close
    # ----------------------------------------
    - name: 1) firewalld http/https 포트 제거
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: disabled
        permanent: true
        immediate: true
      loop:
        - http
        - https


    # ----------------------------------------
    # 2) /etc/httpd/secrets 제거
    # ----------------------------------------
    - name: 2) /etc/httpd/secrets 제거
      ansible.builtin.file:
        path: /etc/httpd/secrets
        state: absent


    # ----------------------------------------
    # 3) /var/www/html/index.html 제거
    # ----------------------------------------
    - name: 3) /var/www/html/index.html 제거
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent


    # ----------------------------------------
    # 4) .htaccess -> htaccess.OLD
    # ----------------------------------------
    - name: 4) .htaccess 파일 복원
      ansible.builtin.command:
        cmd: mv /var/www/html/.htaccess /var/www/html/htaccess.OLD


    # ----------------------------------------
    # 5) httpd 서비스 disable
    # ----------------------------------------
    - name: 5) httpd 서비스 disable
      ansible.builtin.systemd_service:
        name: httpd
        enabled: false
        state: stopped


    # ----------------------------------------
    # 6) httpd 패키지 삭제
    # ----------------------------------------
    - name: 6) httpd 패키지 삭제
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
        state: absent
        autoremove: true