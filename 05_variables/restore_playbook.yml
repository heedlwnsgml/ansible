---
- name: Play01 - 웹서버 설정 
  hosts: webservers
  vars_files:
    - vars/vars.yml
  tasks:
  
    # 1) 방화벽 서비스 제거 - http, https
    - name: 1) 방화벽 등록
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: disabled
        permanent: true
        immediate: true
      loop:
        - "{{ fw_80 }}"
        - "{{ fw_8080 }}"

    # 2) 웹서비스 기동 - httpd, firewalld
    - name: 2) 웹서비스 중지
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - "{{ svc_web }}"
        - "{{ svc_fw }}"

    # 3) 웹서비스 설정 - /var/www/html/index.html
    - name: 3) 웹서비스 설정 삭제
      ansible.builtin.file:
        path: "{{ inx_dest }}"
        state: absent

    # 4) 웹패키지 설치 - httpd, mod_ssl, firewalld
    - name: 4) 웹패키지 삭제 
      ansible.builtin.dnf:
        name:
          - "{{ pkg_http }}"
          - "{{ pkg_https }}"
        state: absent



