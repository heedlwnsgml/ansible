---
##########################################
# 1. Play 01 : WEB-PHP-DB 구현
#   1) WEB + PHP + firewall
#   2) DB
# 2. Play 02 : 웹 요청
#   1) 웹 요청
##########################################
# name을 줄거면 다 주고 한 곳에 name에 안 줬으면 그 아래부터는 name 불가능
#
# 1. Play 01 : WEB-PHP-DB 구현
#
- name: 1. Play 01 - WEB-PHP-DB 구현
  hosts: webservers
  tasks:
    - name: 1) 패키지 설치 - httpd, mod_ssl, PHP, php-mysqlnd, php-pdo, firewalld
      ansible.builtin.dnf:
        name: 
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          - firewalld
        state: present

    - name: 2) 페이지 설정 - /var/www/html/index.php
      ansible.builtin.get_url:
        url: http://192.168.10.10/index.php.txt
        dest: /var/www/html/index.php
        mode: '0644'
    
    - name: 3) 서비스 설정 - httpd, firewalld
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - httpd
        - firewalld

    - name: 4) 방화벽 등록
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      loop:
        - http
        - https

    #   1) WEB + PHP + Firewall
    #     * 패키지 설치
    - name: 1)  패키지 설치 - mariadb-server, mariadb
      ansible.builtin.dnf:
        name: 
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: latest
      
    #     * 서비스 기동
    - name: 2) 서비스 기동 - mariadb.service
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    #     * 서비스 설정
    - name: 3) 서비스 설정 - mysql_secure_installation
      become: true
      ansible.builtin.expect:
        command: /usr/bin/mysql_secure_installation
        responses:
          'Enter current password for root': ''
          'Switch to unix_socket authentication': 'Y'
          'Change the root password?': 'Y'
          'New password': 'soldesk1.'
          'Re-enter new password': 'soldesk1.'
          'Remove anonymous users': 'Y'
          'Disallow root login remotely': 'Y'
          'Remove test database and access to it': 'Y'
          'Reload privilege tables now': 'Y'
        timeout: 1
# ansible-doc ansible.mysql.mysql_user → /EXAM
    - name: 3) 서비스 설정 - 사용자/권한 추가
      become: true
      ansible.mysql.mysql_user:
          login_user: root
          login_password: soldesk1.
          name: soldesk
          password: soldesk1.
          priv: '*.*:ALL'
          state: present
  
    #     * 방화벽 등록
    - name: 4) 방화벽 .서비스(포트) 등록
      ansible.posix.firewalld:
        service: mysql
        state: enabled
        permanent: true
        immediate: true

# 2. Play 02 : 웹 요청
#   1) 웹 요청
#

- name: 0) 웹서버에 요청
  hosts: localhost
  tasks: 
    - name: 1) web1 웹서버에 웹요청 확인
      ansible.builtin.uri:
        url: "http://192.168.10.11/index.php"
        method: GET
        status_code: 200