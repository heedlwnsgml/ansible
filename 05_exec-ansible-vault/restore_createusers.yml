---
- name: Restore createuser.yml
  hosts: devservers
  remote_user: devops
  become: true
  vars_files:
    - vars/secret1
    - vars/secret2
    - vars/secret3
  tasks:  
    - name: 1) 시크릿 파일을 사용한 사용자 삭제
      ansible.builtin.user:
        name: "{{ item_name }}"
        state: absent 
        remove: true
      loop: "{{ newusers1 + newusers2 + newusers3 }}"