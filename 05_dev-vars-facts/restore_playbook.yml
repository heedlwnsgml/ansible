---
#################################################
# 1) 방화벽 포트 제거
# 2) 서비스 종료
# 3) 패키지 삭제
# 4) 팩트 삭제
#################################################

- name: Restore playbook.yml
  hosts: all
  tasks:
    #1) 패키지 설치 - httpd
    - name: 3) 방화벽 제거 - "{{ ansible_local['custom']['general']['fwsvc'] }}"
      ansible.posix.firewalld:
        service: "{{ ansible_local['custom']['general']['fwsvc'] }}"
        state: disabled
        permanent: true
        immediate: true

    - name: 2) 서비스 종료 - "{{ ansible_local['custom']['general']['service'] }}"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled:  false
      loop:
        - "{{ ansible_local['custom']['general']['service'] }}"
        - firewalld

    - name: 1) 패키지 삭제 - "{{ ansible_local['custom']['general']['package'] }}"
      ansible.builtin.dnf:
        name: "{{ ansible_local['custom']['general']['package'] }}"
        state: absent
